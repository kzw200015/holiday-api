spring:
  application:
    name: myapi
  datasource:
    # 部署时可用 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 环境变量覆盖，优先级高于本文件
    url: jdbc:postgresql://localhost:5432/myapi?sslmode=disable
    username: postgres
    password: REDACTED
    hikari:
      # 连接池参数：避免连接数无节制增长，并回收长期空闲连接（未列出的项用 Hikari 默认值）
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 3600000
      connection-timeout: 10000
  http:
    clients:
      # 所有阻塞式 HTTP 客户端的默认超时，目前只有拉取远程节假日数据一个调用方
      connect-timeout: 30s
      read-timeout: 30s

server:
  port: 8000

mybatis-plus:
  global-config:
    banner: false
