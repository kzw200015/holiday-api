# 表结构集中维护，各模块只生成自己的查询与用到的模型。
# 修改后运行 `sqlc generate`，生成代码入库，不要手改。
version: "2"
sql:
  - engine: postgresql
    schema: internal/store/schema.sql
    queries: internal/auth/store/query.sql
    gen:
      go:
        package: store
        out: internal/auth/store
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
  - engine: postgresql
    schema: internal/store/schema.sql
    queries: internal/eh/store/query.sql
    gen:
      go:
        package: store
        out: internal/eh/store
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
  - engine: postgresql
    schema: internal/store/schema.sql
    queries: internal/holiday/store/query.sql
    gen:
      go:
        package: store
        out: internal/holiday/store
        sql_package: pgx/v5
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
