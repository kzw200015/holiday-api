# 复制成同目录下的 application.yml 再填。application.yml 已被 gitignore 挡住，不会入库；
# 从 backend/ 启动时 Spring Boot 会自动加载 ./config/application.yml，它盖过 jar 里的默认值。
#
# 容器部署可以完全不放这个文件，全用环境变量。环境变量名按 Spring Boot 的宽松绑定推出：
# 点和连字符去掉、换成下划线、全大写，例如 myapi.auth.token-ttl → MYAPI_AUTH_TOKENTTL。
#
# 时长写成带单位的字符串（ns / us / ms / s / m / h / d），如 "720h"、"30s"、"30d"。
# 裸数字按毫秒算；"1h30m" 这种组合写法不支持，要写 "90m" 或 ISO 形式 "PT1H30M"。

myapi:
  # 必填，至少 32 字节。登录令牌与图片地址的签名密钥都由它派生，缺了或太短进程直接拒绝启动。
  # 生成：openssl rand -hex 32                            环境变量：MYAPI_SECRETKEY
  secret-key: ""

  # auth:
  #   # 注册默认关闭。要建第一个账号就临时改成 true，注册完改回来重启。MYAPI_AUTH_ALLOWREGISTRATION
  #   allow-registration: false
  #   # 登录令牌有效期，默认 30 天。                                   MYAPI_AUTH_TOKENTTL
  #   token-ttl: 30d

  # eh:
  #   # 签名图片地址的有效期，默认 24 小时。                            MYAPI_EH_ATTACHMENTTTL
  #   attachment-ttl: 24h
  #   # 请求 e 站的超时，默认 30 秒。                                   MYAPI_EH_REQUESTTIMEOUT
  #   request-timeout: 30s
  #   # 请求 e 站时伪装的 User-Agent。                                  MYAPI_EH_USERAGENT
  #   user-agent: "Mozilla/5.0 ..."

  # holiday:
  #   # 定时刷新节假日数据的间隔，默认 24 小时。                        MYAPI_HOLIDAY_REFRESHINTERVAL
  #   refresh-interval: 24h

spring:
  datasource:
    # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
    url: jdbc:postgresql://localhost:5432/myapi
    username: postgres
    password: postgres

# 日志级别。                                                          LOGGING_LEVEL_ROOT
# logging:
#   level:
#     root: info
