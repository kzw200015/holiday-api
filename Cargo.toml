# TODO: 要拆出第二个服务或共享库时，改成 cargo workspace
[package]
name = "myapi"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
jiff = { version = "0.2.37", default-features = false, features = ["std", "serde", "static"] }
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["postgres", "aws-lc-rs"] }
tokio = { version = "1.53.1", features = ["io-util"] }
# 单元测试里不起端口，直接用 oneshot 把一个请求送进 Router
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 二进制 crate，没有外部使用者：这几条是写给库的调用方看的
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
